services:
  - type: web
    name: webappadminbe
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://softallthings.com
    scaling:
      minInstances: 1

