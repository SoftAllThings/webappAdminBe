services:
  - type: web
    name: webappadminbe
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: DB_HOST
        value: aws-1-us-west-1.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        fromSecret: DATABASE_USER
      - key: DB_PASSWORD
        fromSecret: DATABASE_PASSWORD
      - key: DB_MAX_CONNECTIONS
        value: 5
      - key: DB_IDLE_TIMEOUT
        value: 300000
      - key: DB_CONNECTION_TIMEOUT
        value: 10000
      - key: DB_QUERY_TIMEOUT
        value: 30000
      - key: DB_SSL
        value: true
    scaling:
      minInstances: 1
